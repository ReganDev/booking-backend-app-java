# ==========================================
# Production Configuration
# ==========================================

# Server
server.port=${PORT:8080}

# Database (Supabase Postgres)
# Full JDBC connection string (incl. credentials) is provided via the DATABASE_URL
# env var in Railway, so NOTHING secret lives in this repo. Required form (JDBC):
#   jdbc:postgresql://<host>/<db>?user=<user>&password=<pw>&sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration (use environment variables)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.dev.bookingapp=INFO

# Sentry error monitoring. DSN comes from the SENTRY_DSN env var in Railway;
# if unset, Sentry stays disabled (empty default), so nothing secret lives here.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=production
# Uncomment to attach request headers and user IPs to error events.
# Off by default since requests carry customer booking data.
#sentry.send-default-pii=true

# Enquiries / registration
app.registration-enabled=${REGISTRATION_ENABLED:false}
app.enquiry.to=${ENQUIRY_TO:graysitequeries@gmail.com}
app.enquiry.from=${RESEND_FROM:onboarding@resend.dev}
app.resend.api-key=${RESEND_API_KEY:}
# Base for every link emailed to a user (manage booking, password reset,
# claim account, verify email). Must be the dashboard host, since those
# routes live in the React app.
app.frontend-url=${APP_FRONTEND_URL:https://app.bookingbase.co.uk}
app.email-verification.expiry=${EMAIL_VERIFICATION_EXPIRY:24h}
app.email-verification.resend-interval=${EMAIL_VERIFICATION_RESEND_INTERVAL:60s}

# Platform admin (set ADMIN_EMAIL and ADMIN_PASSWORD in Railway to enable)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
