spring.application.name=javabookingapp

# Active profile (set to 'dev' or 'prod')
spring.profiles.active=prod

# Business photo uploads (bucket must exist and allow public reads)
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:business-photos}
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=100MB

# Guest booking OTP
app.booking-otp.expiry=10m
app.booking-otp.resend-interval=60s
app.password-reset.claim-expiry=24h

# Drive-distance for mobile-visit services (free keyless APIs; best-effort)
app.geo.enabled=${GEO_ENABLED:true}
app.geo.postcodes-base-url=${GEO_POSTCODES_BASE_URL:https://api.postcodes.io}
app.geo.osrm-base-url=${GEO_OSRM_BASE_URL:https://router.project-osrm.org}
